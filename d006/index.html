<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
    <link rel="shortcut icon" href="source/favicon/favicon.ico" type="image/x-icon">
</head>

<body>
    <h1>Tags em HTML</h1>
    <p>Listas ul, ol e abbr</p>
    <ul>
        <li><abbr title="Tag <p>">Parágrafos</abbr></li>
        <li><abbr title="Tag <h1, h2...>">Títulos</abbr></li>
        <li><abbr title="Tag <img>">Imagens</abbr></li>
        <li><abbr title="Tag <abbr>">Abreviações</abbr></li>
        <li><abbr title="Tag <code>">Códigos-fonte</abbr></li>
        <li><abbr title="Tag <ul>">Listas numeradas</abbr></li>
        <li><abbr title="Tag <ol>">Listas com demarcadores</abbr></li>
    </ul>
</body>

</html>
